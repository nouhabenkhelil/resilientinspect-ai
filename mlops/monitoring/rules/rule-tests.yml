rule_files:
- alerts.yml
evaluation_interval: 10s
tests:
- interval: 10s
  input_series:
  - series: ri_mon_service_up{source="synthetic"}
    values: 0 0 0 0 1 1 1 1 1
  alert_rule_test:
  - eval_time: 30s
    alertname: MLOpsScienceUnavailable
    exp_alerts:
    - exp_labels:
        source: synthetic
        severity: warning
        scope: mlops
      exp_annotations:
        summary: "MLOpsScienceUnavailable \u2014 inspect source label before interpreting;\
          \ no external notifications"
  - eval_time: 70s
    alertname: MLOpsScienceUnavailable
    exp_alerts: []
- interval: 10s
  input_series:
  - series: up{source="synthetic",job="mlops-monitoring"}
