groups:
- name: resilientinspect
  rules:
  - alert: ScientificBackendUnavailable
    expr: ri_science_up == 0
    for: 30s
    labels:
      severity: warning
    annotations:
      summary: "Le backend scientifique ne r\xE9pond pas au healthcheck"
  - alert: GatewayUnavailable
    expr: ri_gateway_up == 0 or up{job="portal"} == 0
    for: 30s
    labels:
      severity: warning
    annotations:
      summary: Gateway indisponible
  - alert: WorkerInactive
    expr: ri_worker_up == 0
    for: 30s
    labels:
      severity: warning
    annotations:
      summary: Heartbeat worker absent ou trop ancien
  - alert: BatchQueueStalled
    expr: ri_batch_pending > 0 and ri_batch_oldest_pending_seconds > 180
    for: 60s
    labels:
      severity: warning
    annotations:
      summary: "File batch bloqu\xE9e"
  - alert: RepeatedTaskFailures
    expr: ri_batch_failed_recent >= 3
    for: 30s
    labels:
      severity: warning
    annotations:
      summary: "\xC9checs r\xE9p\xE9t\xE9s des t\xE2ches sur les quinze derni\xE8\
        res minutes"
  - alert: HighGatewayLatency
    expr: histogram_quantile(0.95, sum by (le) (rate(ri_http_request_duration_seconds_bucket[5m])))
      > 5
    for: 120s
    labels:
      severity: warning
    annotations:
      summary: "Latence p95 \xE9lev\xE9e sur les requ\xEAtes mesur\xE9es"
  - alert: PostgreSQLUnavailable
    expr: ri_database_up == 0
    for: 30s
    labels:
      severity: warning
    annotations:
      summary: "PostgreSQL ne r\xE9pond pas \xE0 SELECT 1"
  - alert: PrivateStorageLow
    expr: ri_storage_free_bytes < 268435456
    for: 30s
    labels:
      severity: warning
    annotations:
      summary: "Espace disponible faible dans le filesystem du volume priv\xE9 Docker"
# BEGIN MLOPS MONITORING (managed by mlops.monitoring.configure)
- name: ri-mlops-monitoring
  rules:
  - alert: MLOpsScienceUnavailable
    expr: ri_mon_service_up == 0
    for: 20s
    labels:
      severity: warning
      scope: mlops
    annotations:
      summary: "MLOpsScienceUnavailable \u2014 inspect source label before interpreting;\
        \ no external notifications"
  - alert: MLOpsScrapeUnavailable
    expr: up{job="mlops-monitoring"} == 0 or ri_mon_scrape_probe_up == 0
    for: 20s
    labels:
      severity: warning
      scope: mlops
    annotations:
      summary: "MLOpsScrapeUnavailable \u2014 inspect source label before interpreting;\
        \ no external notifications"
  - alert: MLOpsHighErrorRate
    expr: ri_mon_api_error_ratio > 0.05
    for: 20s
    labels:
      severity: warning
      scope: mlops
    annotations:
      summary: "MLOpsHighErrorRate \u2014 inspect source label before interpreting;\
        \ no external notifications"
  - alert: MLOpsHighLatency
    expr: ri_mon_api_p95_seconds > 5
    for: 20s
    labels:
      severity: warning
      scope: mlops
    annotations:
      summary: "MLOpsHighLatency \u2014 inspect source label before interpreting;\
        \ no external notifications"
  - alert: MLOpsHighCPU
    expr: ri_mon_host_cpu_ratio > 0.9
    for: 20s
    labels:
      severity: warning
      scope: mlops
    annotations:
      summary: "MLOpsHighCPU \u2014 inspect source label before interpreting; no external\
        \ notifications"
  - alert: MLOpsHighRAM
    expr: ri_mon_host_memory_ratio > 0.9
    for: 20s
    labels:
      severity: warning
      scope: mlops
    annotations:
      summary: "MLOpsHighRAM \u2014 inspect source label before interpreting; no external\
        \ notifications"
  - alert: MLOpsModelsNotReady
    expr: ri_mon_models_ready{engine="pytorch"} < 15 or ri_mon_models_ready{engine="onnxruntime"}
      < 14
    for: 20s
    labels:
      severity: warning
      scope: mlops
    annotations:
      summary: "MLOpsModelsNotReady \u2014 inspect source label before interpreting;\
        \ no external notifications"
  - alert: MLOpsScoreDrift
    expr: ri_mon_drift_ks_distance > 0.3
    for: 20s
    labels:
      severity: warning
      scope: mlops
    annotations:
      summary: "MLOpsScoreDrift \u2014 inspect source label before interpreting; no\
        \ external notifications"
  - alert: MLOpsAnomalyRateDrift
    expr: ri_mon_drift_anomaly_rate_delta > 0.2
    for: 20s
    labels:
      severity: warning
      scope: mlops
    annotations:
      summary: "MLOpsAnomalyRateDrift \u2014 inspect source label before interpreting;\
        \ no external notifications"
  - alert: MLOpsControlStale
    expr: ri_mon_control_age_seconds > 180 or ri_mon_host_collection_age_seconds >
      180 or ri_mon_drift_age_seconds > 180 or ri_mon_sql_up == 0 or ri_mon_collection_truncated
      > 0 or ri_mon_host_collection_up == 0 or ri_mon_drift_report_up == 0 or ri_mon_invalid_rows
      > 0
    for: 20s
    labels:
      severity: warning
      scope: mlops
    annotations:
      summary: "MLOpsControlStale \u2014 inspect source label before interpreting;\
        \ no external notifications"
