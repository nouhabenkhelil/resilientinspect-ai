global:
  scrape_interval: 10s
  evaluation_interval: 10s
rule_files: [/etc/prometheus/alerts.yml]
scrape_configs:
  - job_name: portal
    authorization: {type: Bearer, credentials_file: /run/secrets/metrics_token}
    static_configs: [{targets: ['portal:8000']}]
  - job_name: observer
    authorization: {type: Bearer, credentials_file: /run/secrets/metrics_token}
    static_configs: [{targets: ['observer:8000']}]
# BEGIN MLOPS MONITORING (managed by mlops.monitoring.configure)
  - job_name: mlops-monitoring
    honor_labels: true
    authorization: {type: Bearer, credentials_file: /run/secrets/metrics_token}
    scrape_timeout: 8s
    static_configs: [{targets: ['mlops-monitoring:9108'], labels: {source: production}}]
