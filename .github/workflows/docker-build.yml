name: Docker build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build ${{ matrix.service }} without scientific artifacts
    runs-on: ubuntu-22.04
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        service: [backend, frontend]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.11.9'
      - run: python -m pip install PyYAML==6.0.3
      - run: python scripts/ci/repository_guard.py
      - name: Compose structure, Dockerfile checks, image build and isolated smoke
        env:
          RI_CI_SERVICE: ${{ matrix.service }}
        run: python scripts/ci/docker_build.py --service "$RI_CI_SERVICE"
      # No registry login, image push, DVC pull, production compose up, or model admission.
