name: CI tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  MLFLOW_DISABLE_TELEMETRY: 'true'
  MLFLOW_DISABLE_AGENT_HINT: '1'
  OMP_NUM_THREADS: '2'
  MKL_NUM_THREADS: '2'
  MPLBACKEND: Agg

jobs:
  repository:
    name: Repository integrity and Python lint
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.11.9'
      - run: python -m pip install PyYAML==6.0.3 ruff==0.17.6
      - run: python scripts/ci/repository_guard.py
      - run: python scripts/ci/check_dvc_metadata.py
      - run: python scripts/ci/actionlint.py
      - run: python -m ruff check --config ruff.toml src backend scripts tests mlops frontend/scripts

  backend:
    name: Python CPU unit and contract tests
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.11.9'
          cache: pip
          cache-dependency-path: |
            backend/requirements*.txt
            scripts/ci/requirements.txt
            scripts/ci/constraints-linux.txt
            mlops/requirements-lock.txt
      - name: Install CPU wheels from the official CPU index
        run: |
          python -m pip install --only-binary=:all: torch==2.15.0+cpu torchvision==0.29.2+cpu --index-url https://download.pytorch.org/whl/cpu
      - run: |
          python -m pip install --only-binary=:all: -r scripts/ci/requirements.txt
      - run: python -m pip install --no-deps --no-build-isolation -e .
      - run: python -m pip check
      - run: python scripts/ci/check_cpu.py
      - run: python scripts/ci/check_api_contract.py
      - name: Synthetic fixtures only; no original data or checkpoints
        run: python -m pytest tests mlops/tests scripts/ci/tests -q --tb=short

  frontend:
    name: React TypeScript lint tests and build
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22.22.1'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run check:contracts
      - run: npm run check:data
      - run: npm test -- --maxWorkers=2
      - run: npm run build
