# Evaluation image uniquement ; aucune segmentation derivee de Grad-CAM.
schema_version: 1
protocol_id: transfer_binary_imagenet256_valnormal95_v1
categories: [bottle, hazelnut, leather]
image_size: [256, 256]
normalization:
  mean: [0.485, 0.456, 0.406]
  std: [0.229, 0.224, 0.225]
score: sigmoid_anomaly_logit
calibration_split: val_synthetic_normal
threshold_quantile: 0.95
quantile_method: higher
decision: strictly_greater
pixel_metrics: false
batch_size: 4
cpu_threads: 2
