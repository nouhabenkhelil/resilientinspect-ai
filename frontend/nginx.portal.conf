worker_processes auto;
pid /tmp/nginx.pid;
# Nginx error records can include raw query strings (OIDC codes/state).
# Keep only the normalized access log and the gateway's structured security audit.
error_log /dev/null crit;
events { worker_connections 128; }
http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    charset utf-8;
    log_format safe escape=json '{"method":"$request_method","uri":"$uri","status":$status,"request_id":"$request_id"}';
    access_log /dev/stdout safe;
    server_tokens off;
    limit_req_zone $binary_remote_addr zone=edge:1m rate=10r/s;
    limit_conn_zone $binary_remote_addr zone=connections:1m;
    client_body_temp_path /tmp/client_temp;
    proxy_temp_path /tmp/proxy_temp;
    fastcgi_temp_path /tmp/fastcgi_temp;
    uwsgi_temp_path /tmp/uwsgi_temp;
    scgi_temp_path /tmp/scgi_temp;
    server {
        listen 8080;
        server_name _;
        root /usr/share/nginx/html;
        index index.html;
        client_max_body_size 11m;
        client_body_timeout 15s;
        keepalive_timeout 15s;
        limit_req zone=edge burst=30 nodelay;
        limit_req_status 429;
        limit_conn connections 12;
        limit_conn_status 429;
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy no-referrer always;
        add_header X-Frame-Options DENY always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; connect-src 'self'; font-src 'self'; object-src 'none'; base-uri 'none'; frame-ancestors 'none'; form-action 'self'" always;
        add_header Cache-Control no-store always;
        location = /nginx-health { access_log off; return 200 "ok\n"; }
        location = /api { return 308 /api/; }
        location /api/ {
            proxy_pass http://portal:8000/;
            proxy_set_header Host $http_host;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-For "";
            proxy_set_header X-Real-IP "";
            proxy_set_header X-Request-ID $request_id;
            proxy_connect_timeout 5s;
            proxy_read_timeout 125s;
            proxy_send_timeout 20s;
            proxy_request_buffering off;
        }
        location / { try_files $uri $uri/ /index.html; }
    }
}
